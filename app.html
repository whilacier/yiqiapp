<style>
    :root {

    }

    * {

    html {

    }

    body {

    }

    img {

    }

    .container {
        width: 100%;

        margin: 0 auto;
        padding: 0 16px;
    }

    /* ============ 头部 ============ */
    header {
        text-align: center;
        padding: clamp(26px, 6vw, 48px) 0 clamp(14px, 4vw, 22px);
    }

    header h1 {
        font-size: clamp(1.4rem, 5.6vw, 2.5rem);

    header p {

        max-width: 700px;
        margin: 0 auto;
    }

    /* ============ 主体两栏 ============ */
    .app-showcase {

        gap: 18px;

    }

    @media (min-width: 900px) {
        .app-showcase {
            grid-template-columns: minmax(0, 1.15fr) minmax(340px, .85fr);
            gap: 32px;
            align-items: start;
            margin-top: 30px;
        }
    }

    .app-screenshot,
    .download-section {
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: clamp(14px, 4vw, 26px);
    }

    .app-screenshot {

    }

    .app-screenshot h2,

        font-size: clamp(1.05rem, 4.2vw, 1.4rem);
        color: var(--text);
        margin-bottom: 16px;
        font-weight: 700;
    }

    /* ============ 轮播 ============ */
    .carousel-container {
        position: relative;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        aspect-ratio: 9 / 16;
        overflow: hidden;
        border-radius: 12px;
        background: #f1f3f5;
        touch-action: pan-y;
        user-select: none;
        -webkit-user-select: none;
    }

    .carousel {
        display: flex;
        height: 100%;
        transition: transform .45s cubic-bezier(.4, 0, .2, 1);
        will-change: transform;
    }

    .carousel-item {
        flex: 0 0 100%;
        min-width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .carousel-item img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: zoom-in;
        -webkit-user-drag: none;
    }

    .carousel-controls {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        transform: translateY(-50%);
        padding: 0 8px;
        pointer-events: none;
        z-index: 10;
    }

    .carousel-control {
        pointer-events: auto;
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, .42);
        color: #fff;
        font-size: 1rem;
        display: grid;
        place-items: center;
        cursor: pointer;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        -webkit-tap-highlight-color: transparent;
        transition: background .2s, transform .1s;
    }

    .carousel-control:active {
        background: rgba(0, 0, 0, .72);
        transform: scale(.94);
    }

    /* 指示器 */
    .carousel-indicators {
        display: flex;
        justify-content: flex-start;
        gap: 6px;
        margin: 12px auto 0;
        max-width: 400px;
        padding: 4px 2px;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        -webkit-overflow-scrolling: touch;
    }

    .carousel-indicators::-webkit-scrollbar {
        display: none;
    }

    .indicator {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        padding: 0;
        border: none;
        border-radius: 999px;
        background: #d0d5da;
        cursor: pointer;
        transition: width .25s ease, background .25s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .indicator.active {
        width: 20px;
        background: var(--primary);
    }

    /* ============ 下载区 ============ */

    .qr-code {

    }

    .download-section > p {
        color: var(--muted);
        font-size: .92rem;
    }

    .download-links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 20px;
    }

    .download-btn {
        display: flex;
        align-items: center;
        justify-content: center;

        padding: 12px 16px;

        font-weight: 600;

        border-radius: 10px;

    }

    .download-btn:active {

    }

    .download-btn.green { background: #27ae60; }
    .download-btn.dark  { background: #2c3e50; }

    .download-btn.disabled {
        background: #b6bec7;
        pointer-events: none;

    @media (hover: hover) {
        .download-btn:hover       { background: var(--primary-dark); }
        .download-btn.green:hover { background: #219653; }
        .download-btn.dark:hover  { background: #1a252f; }
        .carousel-control:hover   { background: rgba(0, 0, 0, .7); }
    }

    /* ============ 特性 ============ */
    .features {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin: 28px 0;
    }

    @media (min-width: 720px) {
        .features {
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;

        }
    }

    .feature {
        background: var(--card);
        padding: clamp(18px, 4.5vw, 26px);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        text-align: center;
    }

    .feature h3 {
        color: var(--text);
        margin-bottom: 10px;
        font-size: 1.08rem;
    }

    .feature p {
        font-size: .94rem;
        color: #555;
    }

    /* ============ 页脚 ============ */
    footer {

        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        color: var(--muted);
        font-size: .85rem;
        margin-top: 30px;
        border-top: 1px solid var(--line);
    }

    /* ============ 大图弹窗 ============ */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, .93);
        padding: 16px;
        align-items: center;
        justify-content: center;
    }

    .modal.show {
        display: flex;
    }

    .modal-content {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 8px;
    }

    .close {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: 12px;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        font-size: 30px;
        line-height: 1;
        color: #fff;
        background: rgba(255, 255, 255, .14);
        border: none;
        border-radius: 50%;
        cursor: pointer;
        z-index: 1001;
        -webkit-tap-highlight-color: transparent;
    }

    .close:active {
        background: rgba(255, 255, 255, .3);
    }

    @media (prefers-reduced-motion: reduce) {
        .carousel { transition: none; }
    }
</style>
</head>

<div id="imageModal" class="modal">

<script>
(function () {
    'use strict';

    var TOTAL_SLIDES = 28;
    var AUTO_DELAY = 3000;

    var carousel, carouselContainer, dots, slides, indicators;
    var currentSlide = 0;
    var autoSlideInterval = null;
    var suppressClickUntil = 0;

    var touchStartX = 0, touchStartY = 0, touchDeltaX = 0, swiping = false;

    /* 仅当设备支持真·鼠标悬停时，才绑定 mouseenter/mouseleave */
    var hasHover = !!(window.matchMedia &&
                      window.matchMedia('(hover: hover) and (pointer: fine)').matches);

    /* ---------- 构建轮播节点 ---------- */
    function buildCarousel() {
        carousel = document.getElementById('carousel');
        dots = document.getElementById('indicators');
        if (!carousel || !dots) return;

        var items = [];
        var dotEls = [];

        for (var i = 0; i < TOTAL_SLIDES; i++) {
            items.push(
                '<div class="carousel-item">' +
                    '<img data-src="images/app_' + (i + 1) + '.webp" ' +
                         'alt="应用截图 ' + (i + 1) + '" ' +
                         'onclick="openModal(this)">' +
                '</div>'
            );
            dotEls.push(
                '<button type="button" class="indicator" ' +
                        'aria-label="第 ' + (i + 1) + ' 张截图" ' +
                        'onclick="goToSlide(' + i + ')"></button>'
            );
        }

        carousel.innerHTML = items.join('');
        dots.innerHTML = dotEls.join('');

        slides = carousel.querySelectorAll('.carousel-item');
        indicators = dots.querySelectorAll('.indicator');
    }

    /* ---------- 更新轮播（含懒加载） ---------- */
    function updateCarousel() {
        if (!carousel) return;

        carousel.style.transform = 'translateX(-' + (currentSlide * 100) + '%)';

        for (var i = 0; i < indicators.length; i++) {
            indicators[i].classList.toggle('active', i === currentSlide);
        }

        // 懒加载：当前图 + 前后各一张
        var total = slides.length;
        var loadIndexes = [
            currentSlide,
            (currentSlide + 1) % total,
            (currentSlide - 1 + total) % total
        ];
        loadIndexes.forEach(function (index) {
            var img = slides[index] && slides[index].querySelector('img');
            if (img && !img.src && img.dataset.src) {
                img.src = img.dataset.src;
            }
        });

        scrollIndicatorIntoView();
    }

    /* ---------- 指示器跟随滚动 ---------- */
    function scrollIndicatorIntoView() {
        var el = indicators && indicators[currentSlide];
        if (!el || !dots) return;
        var target = el.offsetLeft - dots.clientWidth / 2 + el.offsetWidth / 2;
        var max = dots.scrollWidth - dots.clientWidth;
        if (max <= 0) return;
        dots.scrollLeft = Math.max(0, Math.min(target, max));
    }

    /* ---------- 切换 ---------- */
    function nextSlide() {
        if (!slides || !slides.length) return;
        currentSlide = (currentSlide + 1) % slides.length;
        updateCarousel();
    }

    function prevSlide() {
        if (!slides || !slides.length) return;
        currentSlide = (currentSlide - 1 + slides.length) % slides.length;
        updateCarousel();
    }

    function goToSlide(index) {
        if (!slides || !slides.length) return;
        currentSlide = index;
        updateCarousel();
        restartAutoSlide();
    }

    /* ---------- 自动播放（已移除 prefers-reduced-motion 提前返回） ---------- */
    function startAutoSlide() {
        stopAutoSlide();
        if (document.hidden) return;
        // 关键修复：不再因为 prefers-reduced-motion 直接 return
        // 如确实需要尊重系统设置，可改为降低频率，例如 8000ms
        autoSlideInterval = setInterval(nextSlide, AUTO_DELAY);
    }

    function stopAutoSlide() {
        if (autoSlideInterval) {
            clearInterval(autoSlideInterval);
            autoSlideInterval = null;
        }
    }

    function restartAutoSlide() {
        stopAutoSlide();
        startAutoSlide();
    }

    /* ---------- 手势滑动 + 鼠标悬停 ---------- */
    function initSwipe() {
        carouselContainer = document.querySelector('.carousel-container');
        if (!carouselContainer) return;

        carouselContainer.addEventListener('touchstart', function (e) {
            var t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            touchDeltaX = 0;
            swiping = false;
            stopAutoSlide();
        }, { passive: true });

        carouselContainer.addEventListener('touchmove', function (e) {
            var t = e.touches[0];
            var dx = t.clientX - touchStartX;
            var dy = t.clientY - touchStartY;
            if (!swiping && Math.abs(dx) > Math.abs(dy) + 4) swiping = true;
            if (swiping) touchDeltaX = dx;
        }, { passive: true });

        carouselContainer.addEventListener('touchend', function () {
            if (Math.abs(touchDeltaX) > 40) {
                suppressClickUntil = Date.now() + 350;
                if (touchDeltaX < 0) nextSlide(); else prevSlide();
            }
            touchDeltaX = 0;
            swiping = false;
            startAutoSlide();
        }, { passive: true });

        // 仅在支持 hover 的桌面设备绑定鼠标事件，避免触屏设备 mouseenter 干扰
        if (hasHover) {
            carouselContainer.addEventListener('mouseenter', stopAutoSlide);
            carouselContainer.addEventListener('mouseleave', startAutoSlide);
        }
    }

    /* ---------- 大图弹窗 ---------- */
    window.openModal = function (img) {
        if (Date.now() < suppressClickUntil) return;
        var modal = document.getElementById('imageModal');
        var modalImg = document.getElementById('modalImage');
        if (!modal || !modalImg) return;
        modalImg.src = img.currentSrc || img.src;
        modal.classList.add('show');
        document.body.style.overflow = 'hidden';
        stopAutoSlide();
    };

    window.closeModal = function () {
        var modal = document.getElementById('imageModal');
        if (!modal) return;
        modal.classList.remove('show');
        document.body.style.overflow = '';
        startAutoSlide();
    };

    /* ---------- 全局事件 ---------- */
    function bindEvents() {
        var modal = document.getElementById('imageModal');
        if (modal) {
            modal.addEventListener('click', function (e) {
                if (e.target === this) closeModal();
            });
        }

        document.addEventListener('keydown', function (e) {
            var modalEl = document.getElementById('imageModal');
            if (e.key === 'Escape' && modalEl && modalEl.classList.contains('show')) {
                closeModal();
                return;
            }
            if (modalEl && modalEl.classList.contains('show')) return;
            if (e.key === 'ArrowLeft') { prevSlide(); restartAutoSlide(); }
            if (e.key === 'ArrowRight') { nextSlide(); restartAutoSlide(); }
        });

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) stopAutoSlide();
            else startAutoSlide();
        });

        window.addEventListener('resize', scrollIndicatorIntoView);
    }

    /* ---------- 初始化（兼容 DOMContentLoaded 已触发的情况） ---------- */
    function init() {
        buildCarousel();
        updateCarousel();
        initSwipe();
        bindEvents();
        startAutoSlide();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        // DOM 已经加载完，直接执行
        init();
    }

    // 暴露给内联 onclick 使用
    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;
    window.goToSlide = goToSlide;
})();
</script>
